; ===== PENGUATAN EXPORT EXCEL (jangan dihapus) =====
; cPanel ea-php82 (PHP-FPM/LSAPI) membaca .user.ini — .htaccess php_value
; sering diabaikan sehingga ini_set() di kode pun gagal dinaikkan.
; Export 98 kolom x ribuan siswa butuh > 256MB; tanpa ini file XLSX terpotong
; dan Excel melaporkan "unreadable content" (teks hilang, angka tersisa).
memory_limit = 1024M
max_execution_time = 600
post_max_size = 128M
upload_max_filesize = 128M
